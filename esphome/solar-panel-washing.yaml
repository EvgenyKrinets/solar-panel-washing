                id(fault_zone) = 0;
                id(fault_flow) = 0.0f;
                id(fault_threshold) = 0.0f;
                id(violation_kind) = 0;
                id(violation_elapsed_s) = 0;
                id(stage_frozen_seconds) = 0;
                id(stage_kind) = 0;
                id(stage_zone) = 0;
                id(wash_state).publish_state("Ready");


# ============================================================
# LOCAL CLOCK / AUTOMATIC SCHEDULER
# ============================================================

time:

  - platform: sntp
    id: system_time
    timezone: "Asia/Jerusalem"

    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

    on_time:
      - seconds: 0
        minutes: '*'
        hours: '*'

        then:

          - if:

              condition:
                lambda: |-

                  // Scheduler disabled
                  if (!id(settings_synchronized) || !id(auto_start_enabled).state)
                    return false;

                  // Get current local time
                  auto now = id(system_time).now();

                  if (!now.is_valid())
                    return false;

                  // Check configured hour
                  if (
                    now.hour !=
                    (int) id(auto_start_hour).state
                  )
                    return false;

                  // Check configured minute
                  if (
                    now.minute !=
                    (int) id(auto_start_minute).state
                  )
                    return false;

                  // ESPHome day_of_week:
                  // Sunday    = 1
                  // Monday    = 2
                  // Tuesday   = 3
                  // Wednesday = 4
                  // Thursday  = 5
                  // Friday    = 6
                  // Saturday  = 7

                  bool allowed = false;
                  int selected_mode = 0;

                  switch (now.day_of_week) {

                    case 1:
                      allowed = id(auto_sunday).state;
                      selected_mode = id(auto_mode_sunday).active_index().value_or(0);
                      break;

                    case 2:
                      allowed = id(auto_monday).state;
                      selected_mode = id(auto_mode_monday).active_index().value_or(0);
                      break;

                    case 3:
                      allowed = id(auto_tuesday).state;
                      selected_mode = id(auto_mode_tuesday).active_index().value_or(0);
                      break;

                    case 4:
                      allowed = id(auto_wednesday).state;
                      selected_mode = id(auto_mode_wednesday).active_index().value_or(0);
                      break;

                    case 5:
                      allowed = id(auto_thursday).state;
                      selected_mode = id(auto_mode_thursday).active_index().value_or(0);
                      break;

                    case 6:
                      allowed = id(auto_friday).state;
                      selected_mode = id(auto_mode_friday).active_index().value_or(0);
                      break;

                    case 7:
                      allowed = id(auto_saturday).state;
                      selected_mode = id(auto_mode_saturday).active_index().value_or(0);
                      break;
                  }

                  if (!allowed)
                    return false;

                  // Do not start if washing is already active
                  if (id(wash_running))
                    return false;

                  // Do not start if alarm is active
                  if (id(emergency_active))
                    return false;

                  // At least one zone must be enabled
                  if (
                    !id(zone1_enabled).state &&
                    !id(zone2_enabled).state &&
                    !id(zone3_enabled).state &&
                    !id(zone4_enabled).state &&
                    !id(zone5_enabled).state
                  )
                    return false;

                  // Build YYYYMMDD
                  int today =
                    now.year * 10000 +
                    now.month * 100 +
                    now.day_of_month;

                  // Prevent duplicate automatic start
                  if (id(last_auto_start_day) == today)
                    return false;

                  // Mark this day before starting
                  id(last_auto_start_day) = today;
                  id(scheduled_wash_mode) = selected_mode;

                  ESP_LOGI(
                    "wash",
                    "AUTO START %04d-%02d-%02d %02d:%02d",
                    now.year,
                    now.month,
                    now.day_of_month,
                    now.hour,
                    now.minute
                  );

                  return true;


              then:

                - lambda: |-
                    id(wash_state).publish_state(
                      "Automatic Start"
                    );

                - script.execute: start_wash


# ============================================================
# SCRIPTS
# ============================================================

script:

  # ==========================================================
  # ALL OUTPUTS OFF
  # ==========================================================

  - id: all_off
    mode: restart

    then:

      - lambda: |-
          id(flow_check_allowed) = false;

      - switch.turn_off: valve_water
      - switch.turn_off: valve_detergent

      - switch.turn_off: zone1_relay
      - switch.turn_off: zone2_relay
      - switch.turn_off: zone3_relay
      - switch.turn_off: zone4_relay
      - switch.turn_off: zone5_relay

      - delay: 500ms

      - switch.turn_off: valve_power


  # ==========================================================
  # EMERGENCY STOP
  # ==========================================================

  - id: emergency_stop
    mode: restart

    then:

      - lambda: |-
          if (id(actual_stage_last_kind) >= 1 && id(actual_stage_last_kind) <= 3 &&
              id(actual_stage_last_zone) >= 1 && id(actual_stage_last_zone) <= 5 &&
              id(actual_stage_started_ms) != 0) {
            const int i = (id(actual_stage_last_kind) - 1) * 5 + id(actual_stage_last_zone) - 1;
            id(actual_stage_seconds)[i] += (millis() - id(actual_stage_started_ms)) / 1000u;
          }
          id(actual_stage_last_kind) = 0;
          id(actual_stage_last_zone) = 0;
          id(actual_stage_started_ms) = 0;
          id(emergency_active) = true;
          id(wash_running) = false;
          id(flow_check_allowed) = false;
          id(finishing_check) = false;
          if (id(stage_deadline_ms) != 0) {
            int32_t ms = (int32_t)(id(stage_deadline_ms) - millis());
            id(stage_frozen_seconds) = ms > 0 ? (ms + 999) / 1000 : 0;
          }
          id(stage_deadline_ms) = 0;
          id(current_zone_num) = 0;
          if (id(fault_kind) == 0) id(fault_kind) = 5;
          id(wash_state).publish_state("EMERGENCY STOP");

      - script.stop: start_wash
      - script.stop: water_program
      - script.stop: detergent_program
      - script.stop: flow_enable_delay
      - script.stop: finish_wash

      - script.execute: all_off


  # ==========================================================
  # FLOW START DELAY
  # ==========================================================

  - id: flow_enable_delay
    mode: restart
    then:
      # Short grace for a newly opened source; configured delay is confirmation time.
      - lambda: |-
          id(flow_check_allowed) = false;
          id(violation_kind) = 0;
          id(violation_elapsed_s) = 0;
      - delay: 3s
      - if:
          condition:
            lambda: |-
              return id(wash_running) && !id(finishing_check) &&
                     (id(valve_water).state || id(valve_detergent).state);
          then:
            - lambda: |-
                id(flow_check_allowed) = true;

  # ==========================================================
  # START WASH
  # ==========================================================

  - id: start_wash
    mode: single

    then:

      - if:

          condition:
            lambda: |-
              return
                id(wash_running) ||
                id(emergency_active) ||
                !id(settings_synchronized) ||
                id(restore_pending);

          then:

            - lambda: |-
                ESP_LOGW(
                  "wash",
                  "START blocked"
                );

          else:

            - if:

                condition:
                  lambda: |-
                    return
                      !id(zone1_enabled).state &&
                      !id(zone2_enabled).state &&
                      !id(zone3_enabled).state &&
                      !id(zone4_enabled).state &&
                      !id(zone5_enabled).state;

                then:

                  - lambda: |-
                      id(scheduled_wash_mode) = -1;
                      id(wash_state).publish_state(
                        "Error: All zones disabled"
                      );

                else:

                  - lambda: |-
                      // Reset only on an accepted new wash, never on a blocked START.
                      id(actual_stage_seconds).fill(0);
                      id(actual_stage_started_ms) = 0;
                      id(actual_stage_last_kind) = 0;
                      id(actual_stage_last_zone) = 0;
                      id(wash_liters) = 0.0f;
                      id(wash_zone_liters).fill(0.0f);
                      if (!isnan(id(water_total).state)) {
                        id(last_meter_liters) = id(water_total).state;
                        id(meter_initialized) = true;
                      }
                      id(wash_running) = true;
                      id(stage_kind) = 0;
                      id(stage_zone) = 0;
                      id(stage_deadline_ms) = 0;
                      id(stage_frozen_seconds) = 0;
                      id(violation_kind) = 0;
                      id(violation_elapsed_s) = 0;
                      id(flow_check_allowed) = false;
                      id(current_zone_num) = 0;

                      id(wash_state).publish_state(
                        "Starting"
                      );

                  - switch.turn_on: valve_power

                  - delay: 2s

                  - if:

                      condition:
                        lambda: |-
                          auto index =
                            id(wash_mode).active_index();

                          int scheduled = id(scheduled_wash_mode);
                          id(scheduled_wash_mode) = -1;
                          if (scheduled >= 0) return scheduled == 0;
                          return index.has_value() && index.value() == 0;

                      then:

                        - script.execute: water_program

                      else:

                        - script.execute: detergent_program


  # ==========================================================
  # WATER PROGRAM
  # ==========================================================

  - id: water_program
    mode: single

    then:

      - switch.turn_off: valve_detergent

      - delay: !lambda |-
          return (uint32_t)
            (id(source_delay).state * 1000.0f);

      - switch.turn_on: valve_water

      - script.execute: flow_enable_delay


      # ======================================================
      # ZONE 1
      # ======================================================

      - if:

          condition:
            switch.is_on: zone1_enabled

          then:

            - switch.turn_on: zone1_relay

            - lambda: |-
                id(current_zone_num) = 1;

                id(wash_state).publish_state(
                  "Water - Zone 1"
                );

            - lambda: |-
                // Finish previous stage at the exact transition, then start this timer.
                if (id(actual_stage_last_kind) >= 1 && id(actual_stage_last_kind) <= 3 &&
                    id(actual_stage_last_zone) >= 1 && id(actual_stage_last_zone) <= 5 &&
                    id(actual_stage_started_ms) != 0) {
                  int prev = (id(actual_stage_last_kind) - 1) * 5 + id(actual_stage_last_zone) - 1;
                  id(actual_stage_seconds)[prev] += (millis() - id(actual_stage_started_ms)) / 1000u;
                }
