# ============================================================
# FLOW METER
#
# YF-B5
# DI1 = GPIO4
# 396 pulses/liter
#
# Keep Flow Protection OFF until meter is installed and tested.
# ============================================================

sensor:

  - platform: pulse_counter
    pin:
      number: GPIO4
      mode:
        input: true

    id: water_flow
    name: "Water Flow"
    icon: mdi:water-pump
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 1s

    filters:
      - multiply: 0.0025252525

    total:
      id: water_total_raw
      internal: true
      icon: mdi:water
      unit_of_measurement: "L"
      accuracy_decimals: 2

      filters:
        - multiply: 0.0025252525


  # Total is restored from Home Assistant after each boot.
  - platform: template
    id: water_total
    name: "Total Water"
    icon: mdi:water
    unit_of_measurement: "L"
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      return id(persistent_water_liters);

  # Litres in the current/most recently completed wash.
  - platform: template
    id: current_wash_water
    name: "Current Wash Water"
    unit_of_measurement: "L"
    icon: mdi:water-check
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      return id(wash_liters);

  - platform: template
    name: "Wash Zone 1 Water"
    id: wash_zone_1_water
    unit_of_measurement: "L"
    icon: mdi:water
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      return id(wash_zone_liters)[0];

  - platform: template
    name: "Wash Zone 2 Water"
    id: wash_zone_2_water
    unit_of_measurement: "L"
    icon: mdi:water
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      return id(wash_zone_liters)[1];

  - platform: template
    name: "Wash Zone 3 Water"
    id: wash_zone_3_water
    unit_of_measurement: "L"
    icon: mdi:water
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      return id(wash_zone_liters)[2];

  - platform: template
    name: "Wash Zone 4 Water"
    id: wash_zone_4_water
    unit_of_measurement: "L"
    icon: mdi:water
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
