    name: "Current Zone"
    id: current_zone_text
    update_interval: 1s

    lambda: |-
      switch (id(current_zone_num)) {
        case 1: return {"Zone 1"};
        case 2: return {"Zone 2"};
        case 3: return {"Zone 3"};
        case 4: return {"Zone 4"};
        case 5: return {"Zone 5"};
        default: return {"None"};
      }


