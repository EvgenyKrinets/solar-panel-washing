esphome:
  name: solar-panel-washing
  friendly_name: "Solar Panel Washing"

  on_boot:
    priority: -100
    then:
      - script.execute: all_off
      - lambda: |-
          id(wash_running) = false;
          id(emergency_active) = false;
          id(current_zone_num) = 0;
          id(flow_check_allowed) = false;
          id(wash_state).publish_state("Ready");


esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf


logger:


api:
  encryption:
    key: !secret solar_panel_washing__encryption_key


ota:
  - platform: esphome


wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Solar Washing Fallback"
    password: "12345678"


captive_portal:


# ============================================================
# I2C / WAVESHARE RELAY EXPANDER
# ============================================================

i2c:
  sda: GPIO42
  scl: GPIO41
  scan: true
  frequency: 100kHz


pca9554:
  - id: relay_hub
    address: 0x20


# ============================================================
# INTERNAL VARIABLES
# ============================================================

globals:

  - id: wash_running
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: emergency_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: current_zone_num
    type: int
    restore_value: no
    initial_value: '0'

  - id: flow_check_allowed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: scheduled_wash_mode
    type: int
    restore_value: no
    initial_value: '-1'

  - id: last_auto_start_day
    type: int
    restore_value: no
    initial_value: '0'


# ============================================================
# RELAYS
#
# CH1 = FILTERED WATER
# CH2 = DETERGENT
# CH3 = ZONE 1
# CH4 = ZONE 2
# CH5 = ZONE 3
# CH6 = ZONE 4
# CH7 = ZONE 5
# CH8 = TRANSFORMER POWER
# ============================================================

switch:

  # ==========================================================
  # CH1 - FILTERED WATER
  # ==========================================================

  - platform: gpio
    name: "CH1 Filtered Water"
    id: valve_water
    icon: mdi:water

    pin:
      pca9554: relay_hub
      number: 0
      mode:
        output: true

    restore_mode: ALWAYS_OFF

    interlock:
      - valve_detergent

    interlock_wait_time: 500ms


  # ==========================================================
  # CH2 - DETERGENT
  # ==========================================================

  - platform: gpio
    name: "CH2 Detergent"
    id: valve_detergent
    icon: mdi:spray-bottle

    pin:
      pca9554: relay_hub
      number: 1
      mode:
        output: true

    restore_mode: ALWAYS_OFF

    interlock:
      - valve_water

    interlock_wait_time: 500ms


  # ==========================================================
  # CH3 - ZONE 1
  # ==========================================================

  - platform: gpio
    name: "CH3 Zone 1"
    id: zone1_relay
    icon: mdi:sprinkler

    pin:
      pca9554: relay_hub
      number: 2
      mode:
        output: true

    restore_mode: ALWAYS_OFF


  # ==========================================================
  # CH4 - ZONE 2
  # ==========================================================

  - platform: gpio
    name: "CH4 Zone 2"
    id: zone2_relay
    icon: mdi:sprinkler

    pin:
      pca9554: relay_hub
      number: 3
      mode:
        output: true

    restore_mode: ALWAYS_OFF


  # ==========================================================
  # CH5 - ZONE 3
  # ==========================================================

  - platform: gpio
    name: "CH5 Zone 3"
    id: zone3_relay
    icon: mdi:sprinkler

    pin:
      pca9554: relay_hub
      number: 4
      mode:
        output: true

    restore_mode: ALWAYS_OFF


  # ==========================================================
  # CH6 - ZONE 4
  # ==========================================================

  - platform: gpio
    name: "CH6 Zone 4"
    id: zone4_relay
    icon: mdi:sprinkler

    pin:
      pca9554: relay_hub
      number: 5
      mode:
        output: true

    restore_mode: ALWAYS_OFF


  # ==========================================================
  # CH7 - ZONE 5
  # ==========================================================

  - platform: gpio
    name: "CH7 Zone 5"
    id: zone5_relay
    icon: mdi:sprinkler

    pin:
      pca9554: relay_hub
      number: 6
      mode:
        output: true

    restore_mode: ALWAYS_OFF


  # ==========================================================
  # CH8 - VALVE TRANSFORMER POWER
  # ==========================================================

  - platform: gpio
    name: "CH8 Valve Power"
    id: valve_power
    icon: mdi:power

    pin:
      pca9554: relay_hub
      number: 7
      mode:
        output: true

    restore_mode: ALWAYS_OFF


  # ==========================================================
  # ENABLE / DISABLE ZONES
  # ==========================================================

  - platform: template
    name: "Zone 1 Enabled"
    id: zone1_enabled
    icon: mdi:checkbox-marked-circle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Zone 2 Enabled"
    id: zone2_enabled
    icon: mdi:checkbox-marked-circle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Zone 3 Enabled"
    id: zone3_enabled
    icon: mdi:checkbox-marked-circle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Zone 4 Enabled"
    id: zone4_enabled
    icon: mdi:checkbox-marked-circle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "Zone 5 Enabled"
    id: zone5_enabled
    icon: mdi:checkbox-marked-circle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON


  # ==========================================================
  # FLOW PROTECTION
  # Keep OFF until YF-B5 is installed and tested
  # ==========================================================

  - platform: template
    name: "Flow Protection"
    id: flow_protection
    icon: mdi:shield-water
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF


  # ==========================================================
  # AUTOMATIC START
  # ==========================================================

  - platform: template
    name: "Automatic Wash Start"
    id: auto_start_enabled
    icon: mdi:clock-start
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF


  # ==========================================================
  # AUTOMATIC START DAYS
  # ==========================================================

  - platform: template
    name: "Auto Start Monday"
    id: auto_monday
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Auto Start Tuesday"
    id: auto_tuesday
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Auto Start Wednesday"
    id: auto_wednesday
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Auto Start Thursday"
    id: auto_thursday
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Auto Start Friday"
    id: auto_friday
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Auto Start Saturday"
    id: auto_saturday
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Auto Start Sunday"
    id: auto_sunday
    icon: mdi:calendar
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF


