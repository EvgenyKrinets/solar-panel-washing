    restore_value: true
    optimistic: true


# ============================================================
# FLOW METER
#
# YF-B5
# DI1 = GPIO4
# 396 pulses/liter
#
# Keep Flow Protection OFF until meter is installed and tested.
# ============================================================

sensor:

  - platform: pulse_counter
    pin:
      number: GPIO4
      mode:
        input: true

    id: water_flow
    name: "Water Flow"
    icon: mdi:water-pump
    unit_of_measurement: "L/min"
    accuracy_decimals: 2
    update_interval: 1s

    filters:
      - multiply: 0.0025252525

    total:
      id: water_total
      name: "Total Water"
      icon: mdi:water
      unit_of_measurement: "L"
      accuracy_decimals: 2

      filters:
        - multiply: 0.0025252525


  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s


  - platform: uptime
    name: "Controller Uptime"


# ============================================================
# BINARY STATUS
# ============================================================

binary_sensor:

  - platform: status
    name: "Washing Controller Online"


  - platform: template
    name: "Washing Active"
    id: washing_status

    lambda: |-
      return id(wash_running);


  - platform: template
    name: "Washing Alarm"
    id: alarm_status
    device_class: problem

    lambda: |-
      return id(emergency_active);


# ============================================================
# TEXT STATUS
# ============================================================

text_sensor:

  - platform: template
    name: "Washing Status"
    id: wash_state
    update_interval: never


  - platform: template
    name: "Current Zone"
    id: current_zone_text
    update_interval: 1s

    lambda: |-
      switch (id(current_zone_num)) {
        case 1: return {"Zone 1"};
        case 2: return {"Zone 2"};
        case 3: return {"Zone 3"};
        case 4: return {"Zone 4"};
        case 5: return {"Zone 5"};
        default: return {"None"};
      }


  - platform: template
    name: "Next Automatic Start"
    id: next_auto_start_text
    icon: mdi:calendar-clock
    update_interval: 30s

    lambda: |-
      if (!id(auto_start_enabled).state)
        return {"Disabled"};

      auto now = id(system_time).now();

      if (!now.is_valid())
        return {"Waiting for time"};

      char buffer[32];

      snprintf(
        buffer,
        sizeof(buffer),
        "%02d:%02d",
        (int) id(auto_start_hour).state,
        (int) id(auto_start_minute).state
      );

      return {buffer};


  - platform: wifi_info

    ip_address:
      name: "IP Address"

    ssid:
      name: "WiFi Network"

    mac_address:
      name: "WiFi MAC Address"


# ============================================================
# BUTTONS
# ============================================================

button:

  - platform: template
    name: "Start Washing"
    icon: mdi:play

    on_press:
      - script.execute: start_wash


  - platform: template
    name: "Emergency Stop"
    icon: mdi:alert-octagon

    on_press:
      - script.execute: emergency_stop


  - platform: template
    name: "Reset Alarm"
    icon: mdi:restart

    on_press:

      - if:
          condition:
            lambda: |-
              return !id(wash_running);

          then:

            - lambda: |-
                id(emergency_active) = false;
                id(wash_state).publish_state("Ready");


# ============================================================
# LOCAL CLOCK / AUTOMATIC SCHEDULER
# ============================================================

time:

  - platform: sntp
    id: system_time
    timezone: "Asia/Jerusalem"

    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

    on_time:

      - seconds: 0
        minutes: '*'
        hours: '*'

        then:

          - if:

              condition:
                lambda: |-

                  // Scheduler disabled
                  if (!id(auto_start_enabled).state)
                    return false;

                  // Get current local time
                  auto now = id(system_time).now();

                  if (!now.is_valid())
                    return false;

                  // Check configured hour
                  if (
                    now.hour !=
                    (int) id(auto_start_hour).state
                  )
                    return false;

                  // Check configured minute
                  if (
                    now.minute !=
                    (int) id(auto_start_minute).state
                  )
                    return false;

                  // ESPHome day_of_week:
                  // Sunday    = 1
                  // Monday    = 2
                  // Tuesday   = 3
                  // Wednesday = 4
                  // Thursday  = 5
                  // Friday    = 6
                  // Saturday  = 7

                  bool allowed = false;
                  int selected_mode = 0;

                  switch (now.day_of_week) {

                    case 1:
                      allowed = id(auto_sunday).state;
                      selected_mode = id(auto_mode_sunday).active_index().value_or(0);
                      break;

                    case 2:
                      allowed = id(auto_monday).state;
                      selected_mode = id(auto_mode_monday).active_index().value_or(0);
                      break;

                    case 3:
                      allowed = id(auto_tuesday).state;
                      selected_mode = id(auto_mode_tuesday).active_index().value_or(0);
                      break;

                    case 4:
                      allowed = id(auto_wednesday).state;
                      selected_mode = id(auto_mode_wednesday).active_index().value_or(0);
                      break;

                    case 5:
                      allowed = id(auto_thursday).state;
                      selected_mode = id(auto_mode_thursday).active_index().value_or(0);
                      break;

                    case 6:
                      allowed = id(auto_friday).state;
                      selected_mode = id(auto_mode_friday).active_index().value_or(0);
                      break;

                    case 7:
                      allowed = id(auto_saturday).state;
                      selected_mode = id(auto_mode_saturday).active_index().value_or(0);
                      break;
                  }

                  if (!allowed)
                    return false;

                  // Do not start if washing is already active
                  if (id(wash_running))
                    return false;

                  // Do not start if alarm is active
                  if (id(emergency_active))
                    return false;

                  // At least one zone must be enabled
                  if (
                    !id(zone1_enabled).state &&
                    !id(zone2_enabled).state &&
                    !id(zone3_enabled).state &&
                    !id(zone4_enabled).state &&
                    !id(zone5_enabled).state
                  )
                    return false;

                  // Build YYYYMMDD
                  int today =
                    now.year * 10000 +
                    now.month * 100 +
                    now.day_of_month;

                  // Prevent duplicate automatic start
                  if (id(last_auto_start_day) == today)
                    return false;

                  // Mark this day before starting
                  id(last_auto_start_day) = today;
                  id(scheduled_wash_mode) = selected_mode;

                  ESP_LOGI(
                    "wash",
                    "AUTO START %04d-%02d-%02d %02d:%02d",
                    now.year,
                    now.month,
                    now.day_of_month,
                    now.hour,
                    now.minute
                  );

                  return true;


              then:

                - lambda: |-
                    id(wash_state).publish_state(
                      "Automatic Start"
                    );

                - script.execute: start_wash


# ============================================================
# SCRIPTS
# ============================================================

script:

  # ==========================================================
  # ALL OUTPUTS OFF
  # ==========================================================

  - id: all_off
    mode: restart

    then:

      - lambda: |-
          id(flow_check_allowed) = false;

      - switch.turn_off: valve_water
      - switch.turn_off: valve_detergent

      - switch.turn_off: zone1_relay
      - switch.turn_off: zone2_relay
      - switch.turn_off: zone3_relay
      - switch.turn_off: zone4_relay
      - switch.turn_off: zone5_relay

      - delay: 500ms

      - switch.turn_off: valve_power


  # ==========================================================
  # EMERGENCY STOP
  # ==========================================================

  - id: emergency_stop
    mode: restart

    then:

      - lambda: |-
          id(emergency_active) = true;
          id(wash_running) = false;
          id(flow_check_allowed) = false;
          id(current_zone_num) = 0;
          id(wash_state).publish_state("EMERGENCY STOP");

      - script.stop: water_program
      - script.stop: detergent_program
      - script.stop: flow_enable_delay

      - script.execute: all_off


  # ==========================================================
  # FLOW START DELAY
  # ==========================================================

  - id: flow_enable_delay
    mode: restart

    then:

      - lambda: |-
          id(flow_check_allowed) = false;

      - delay: !lambda |-
          return (uint32_t)
            (id(flow_start_delay).state * 1000.0f);

      - if:

          condition:
            lambda: |-
              return
                id(wash_running) &&
                (
                  id(valve_water).state ||
                  id(valve_detergent).state
                );

          then:

            - lambda: |-
                id(flow_check_allowed) = true;


  # ==========================================================
  # START WASH
  # ==========================================================

  - id: start_wash
    mode: single

    then:

      - if:

          condition:
            lambda: |-
              return
                id(wash_running) ||
                id(emergency_active);

          then:

            - lambda: |-
                ESP_LOGW(
                  "wash",
                  "START blocked"
                );

          else:

            - if:

                condition:
                  lambda: |-
                    return
                      !id(zone1_enabled).state &&
                      !id(zone2_enabled).state &&
                      !id(zone3_enabled).state &&
                      !id(zone4_enabled).state &&
                      !id(zone5_enabled).state;

                then:

                  - lambda: |-
                      id(scheduled_wash_mode) = -1;
                      id(wash_state).publish_state(
                        "Error: All zones disabled"
                      );

                else:

                  - lambda: |-
                      id(wash_running) = true;
                      id(flow_check_allowed) = false;
                      id(current_zone_num) = 0;

                      id(wash_state).publish_state(
                        "Starting"
                      );

                  - switch.turn_on: valve_power

                  - delay: 2s

                  - if:

                      condition:
                        lambda: |-
                          auto index =
                            id(wash_mode).active_index();

                          int scheduled = id(scheduled_wash_mode);
                          id(scheduled_wash_mode) = -1;
                          if (scheduled >= 0) return scheduled == 0;
                          return index.has_value() && index.value() == 0;

                      then:

                        - script.execute: water_program

                      else:

                        - script.execute: detergent_program


  # ==========================================================
  # WATER PROGRAM
  # ==========================================================

  - id: water_program
    mode: single

    then:

      - switch.turn_off: valve_detergent

      - delay: !lambda |-
          return (uint32_t)
            (id(source_delay).state * 1000.0f);

      - switch.turn_on: valve_water

      - script.execute: flow_enable_delay


      # ======================================================
      # ZONE 1
      # ======================================================

      - if:

          condition:
            switch.is_on: zone1_enabled

          then:

            - switch.turn_on: zone1_relay

            - lambda: |-
                id(current_zone_num) = 1;

                id(wash_state).publish_state(
                  "Water - Zone 1"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(water_time_z1).state * 1000.0f);


      # ======================================================
      # ZONE 2
      # ======================================================

      - if:

          condition:
            switch.is_on: zone2_enabled

          then:

            - switch.turn_on: zone2_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay

            - lambda: |-
                id(current_zone_num) = 2;

                id(wash_state).publish_state(
                  "Water - Zone 2"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(water_time_z2).state * 1000.0f);


      # ======================================================
      # ZONE 3
      # ======================================================

      - if:

          condition:
            switch.is_on: zone3_enabled

          then:

            - switch.turn_on: zone3_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay
            - switch.turn_off: zone2_relay

            - lambda: |-
                id(current_zone_num) = 3;

                id(wash_state).publish_state(
                  "Water - Zone 3"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(water_time_z3).state * 1000.0f);


      # ======================================================
      # ZONE 4
      # ======================================================

      - if:

          condition:
            switch.is_on: zone4_enabled

          then:

            - switch.turn_on: zone4_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay
            - switch.turn_off: zone2_relay
            - switch.turn_off: zone3_relay

            - lambda: |-
                id(current_zone_num) = 4;

                id(wash_state).publish_state(
                  "Water - Zone 4"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(water_time_z4).state * 1000.0f);


      # ======================================================
      # ZONE 5
      # ======================================================

      - if:

          condition:
            switch.is_on: zone5_enabled

          then:

            - switch.turn_on: zone5_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay
            - switch.turn_off: zone2_relay
            - switch.turn_off: zone3_relay
            - switch.turn_off: zone4_relay

            - lambda: |-
                id(current_zone_num) = 5;

                id(wash_state).publish_state(
                  "Water - Zone 5"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(water_time_z5).state * 1000.0f);


      - script.execute: finish_wash


  # ==========================================================
  # DETERGENT PROGRAM
  # ==========================================================

  - id: detergent_program
    mode: single

    then:

      - switch.turn_off: valve_water
      - switch.turn_off: valve_detergent

      - lambda: |-
          id(flow_check_allowed) = false;


      # ======================================================
      # ZONE 1
      # ======================================================

      - if:

          condition:
            switch.is_on: zone1_enabled

          then:

            - switch.turn_on: zone1_relay

            - lambda: |-
                id(current_zone_num) = 1;

                id(wash_state).publish_state(
                  "Preparing - Zone 1"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_detergent
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Detergent - Zone 1"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(detergent_time_z1).state * 1000.0f);

            - switch.turn_off: valve_detergent

            - lambda: |-
                id(flow_check_allowed) = false;

                id(wash_state).publish_state(
                  "Source Delay - Zone 1"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_water
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Rinse - Zone 1"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(rinse_time_z1).state * 1000.0f);


      # ======================================================
      # ZONE 2
      # ======================================================

      - if:

          condition:
            switch.is_on: zone2_enabled

          then:

            - switch.turn_on: zone2_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay

            - switch.turn_off: valve_water

            - lambda: |-
                id(flow_check_allowed) = false;
                id(current_zone_num) = 2;

                id(wash_state).publish_state(
                  "Source Delay - Zone 2"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_detergent
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Detergent - Zone 2"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(detergent_time_z2).state * 1000.0f);

            - switch.turn_off: valve_detergent

            - lambda: |-
                id(flow_check_allowed) = false;

                id(wash_state).publish_state(
                  "Source Delay - Zone 2"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_water
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Rinse - Zone 2"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(rinse_time_z2).state * 1000.0f);


      # ======================================================
      # ZONE 3
      # ======================================================

      - if:

          condition:
            switch.is_on: zone3_enabled

          then:

            - switch.turn_on: zone3_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay
            - switch.turn_off: zone2_relay

            - switch.turn_off: valve_water

            - lambda: |-
                id(flow_check_allowed) = false;
                id(current_zone_num) = 3;

                id(wash_state).publish_state(
                  "Source Delay - Zone 3"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_detergent
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Detergent - Zone 3"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(detergent_time_z3).state * 1000.0f);

            - switch.turn_off: valve_detergent

            - lambda: |-
                id(flow_check_allowed) = false;

                id(wash_state).publish_state(
                  "Source Delay - Zone 3"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_water
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Rinse - Zone 3"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(rinse_time_z3).state * 1000.0f);


      # ======================================================
      # ZONE 4
      # ======================================================

      - if:

          condition:
            switch.is_on: zone4_enabled

          then:

            - switch.turn_on: zone4_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay
            - switch.turn_off: zone2_relay
            - switch.turn_off: zone3_relay

            - switch.turn_off: valve_water

            - lambda: |-
                id(flow_check_allowed) = false;
                id(current_zone_num) = 4;

                id(wash_state).publish_state(
                  "Source Delay - Zone 4"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_detergent
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Detergent - Zone 4"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(detergent_time_z4).state * 1000.0f);

            - switch.turn_off: valve_detergent

            - lambda: |-
                id(flow_check_allowed) = false;

                id(wash_state).publish_state(
                  "Source Delay - Zone 4"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_water
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Rinse - Zone 4"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(rinse_time_z4).state * 1000.0f);


      # ======================================================
      # ZONE 5
      # ======================================================

      - if:

          condition:
            switch.is_on: zone5_enabled

          then:

            - switch.turn_on: zone5_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay
            - switch.turn_off: zone2_relay
            - switch.turn_off: zone3_relay
            - switch.turn_off: zone4_relay

            - switch.turn_off: valve_water

            - lambda: |-
                id(flow_check_allowed) = false;
                id(current_zone_num) = 5;

                id(wash_state).publish_state(
                  "Source Delay - Zone 5"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_detergent
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Detergent - Zone 5"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(detergent_time_z5).state * 1000.0f);

            - switch.turn_off: valve_detergent

            - lambda: |-
                id(flow_check_allowed) = false;

                id(wash_state).publish_state(
                  "Source Delay - Zone 5"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_water
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Rinse - Zone 5"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(rinse_time_z5).state * 1000.0f);


      - script.execute: finish_wash


  # ==========================================================
  # FINISH WASH
  # ==========================================================

  - id: finish_wash
    mode: restart

    then:

      - lambda: |-
          id(flow_check_allowed) = false;

          id(wash_state).publish_state(
            "Finishing"
          );

      - script.stop: flow_enable_delay

      - script.execute: all_off

      - delay: 1s

      - lambda: |-
          id(wash_running) = false;
          id(current_zone_num) = 0;

          id(wash_state).publish_state(
            "Ready"
          );


# ============================================================
# LOCAL SAFETY WATCHDOG
# ============================================================

interval:

  - interval: 1s

    then:

      # ======================================================
      # LOW / HIGH FLOW PROTECTION
      # ======================================================

      - if:

          condition:
            lambda: |-

              // Protection disabled
              if (!id(flow_protection).state)
                return false;

              // Only check during active washing
              if (!id(wash_running))
                return false;

              // Wait for configured startup delay
              if (!id(flow_check_allowed))
                return false;

              // A source valve must be open
              if (
                !id(valve_water).state &&
                !id(valve_detergent).state
              )
                return false;

              float f =
                id(water_flow).state;

              if (isnan(f))
                return false;

              return
                f < id(min_flow).state ||
                f > id(max_flow).state;


          then:

            - lambda: |-
                ESP_LOGE(
                  "wash",
                  "FLOW ALARM %.2f L/min",
                  id(water_flow).state
                );

                id(wash_state).publish_state(
                  "Flow Alarm"
                );

            - script.execute: emergency_stop


      # ======================================================
      # LEAK DETECTION
      # ======================================================

      - if:

          condition:
            lambda: |-

              // Protection disabled
              if (!id(flow_protection).state)
                return false;

              // Leak check only while washing is stopped
              if (id(wash_running))
                return false;

              // Do not repeatedly trigger while alarm is active
              if (id(emergency_active))
                return false;

              float f =
                id(water_flow).state;

              if (isnan(f))
                return false;

              return
                f > id(leak_flow).state;


          then:

            - lambda: |-
                ESP_LOGE(
                  "wash",
                  "LEAK %.2f L/min",
                  id(water_flow).state
                );

                id(wash_state).publish_state(
                  "Leak Detected"
                );

            - script.execute: emergency_stop