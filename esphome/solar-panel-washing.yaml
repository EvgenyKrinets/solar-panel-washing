                if (id(actual_stage_last_kind) >= 1 && id(actual_stage_last_kind) <= 3 &&
                    id(actual_stage_last_zone) >= 1 && id(actual_stage_last_zone) <= 5 &&
                    id(actual_stage_started_ms) != 0) {
                  int prev = (id(actual_stage_last_kind) - 1) * 5 + id(actual_stage_last_zone) - 1;
                  id(actual_stage_seconds)[prev] += (millis() - id(actual_stage_started_ms)) / 1000u;
                }
                id(actual_stage_last_kind) = 2;
                id(actual_stage_last_zone) = 4;
                id(actual_stage_started_ms) = millis();
                id(stage_kind) = 2;
                id(stage_zone) = 4;
                id(stage_deadline_ms) = millis() + (uint32_t)(id(detergent_time_z4).state * 1000.0f);
                id(stage_frozen_seconds) = 0;

            - delay: !lambda |-
                return (uint32_t)
                  (id(detergent_time_z4).state * 1000.0f);
            - lambda: |-
                // Freeze actual elapsed time at the end of this timed step.
                // Do not include valve overlap or source-switching delays.
                if (id(actual_stage_last_kind) == 2 &&
                    id(actual_stage_last_zone) == 4 &&
                    id(actual_stage_started_ms) != 0) {
                  const int i = 8;
                  id(actual_stage_seconds)[i] += (millis() - id(actual_stage_started_ms)) / 1000u;
                  id(actual_stage_last_kind) = 0;
                  id(actual_stage_last_zone) = 0;
                  id(actual_stage_started_ms) = 0;
                }


            - switch.turn_off: valve_detergent

            - lambda: |-
                id(flow_check_allowed) = false;

                id(wash_state).publish_state(
                  "Source Delay - Zone 4"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_water
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Rinse - Zone 4"
                );

            - lambda: |-
                // Finish previous stage at the exact transition, then start this timer.
                if (id(actual_stage_last_kind) >= 1 && id(actual_stage_last_kind) <= 3 &&
                    id(actual_stage_last_zone) >= 1 && id(actual_stage_last_zone) <= 5 &&
                    id(actual_stage_started_ms) != 0) {
                  int prev = (id(actual_stage_last_kind) - 1) * 5 + id(actual_stage_last_zone) - 1;
                  id(actual_stage_seconds)[prev] += (millis() - id(actual_stage_started_ms)) / 1000u;
                }
                id(actual_stage_last_kind) = 3;
                id(actual_stage_last_zone) = 4;
                id(actual_stage_started_ms) = millis();
                id(stage_kind) = 3;
                id(stage_zone) = 4;
                id(stage_deadline_ms) = millis() + (uint32_t)(id(rinse_time_z4).state * 1000.0f);
                id(stage_frozen_seconds) = 0;

            - delay: !lambda |-
                return (uint32_t)
                  (id(rinse_time_z4).state * 1000.0f);
            - lambda: |-
                // Freeze actual elapsed time at the end of this timed step.
                // Do not include valve overlap or source-switching delays.
                if (id(actual_stage_last_kind) == 3 &&
                    id(actual_stage_last_zone) == 4 &&
                    id(actual_stage_started_ms) != 0) {
                  const int i = 13;
                  id(actual_stage_seconds)[i] += (millis() - id(actual_stage_started_ms)) / 1000u;
                  id(actual_stage_last_kind) = 0;
                  id(actual_stage_last_zone) = 0;
                  id(actual_stage_started_ms) = 0;
                }



      # ======================================================
      # ZONE 5
      # ======================================================

      - if:

          condition:
            switch.is_on: zone5_enabled

          then:

            - switch.turn_on: zone5_relay

            - delay: !lambda |-
                return (uint32_t)
                  (id(zone_overlap).state * 1000.0f);

            - switch.turn_off: zone1_relay
            - switch.turn_off: zone2_relay
            - switch.turn_off: zone3_relay
            - switch.turn_off: zone4_relay

            - switch.turn_off: valve_water

            - lambda: |-
                id(flow_check_allowed) = false;
                id(current_zone_num) = 5;

                id(wash_state).publish_state(
                  "Source Delay - Zone 5"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_detergent
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Detergent - Zone 5"
                );

            - lambda: |-
                // Finish previous stage at the exact transition, then start this timer.
                if (id(actual_stage_last_kind) >= 1 && id(actual_stage_last_kind) <= 3 &&
                    id(actual_stage_last_zone) >= 1 && id(actual_stage_last_zone) <= 5 &&
                    id(actual_stage_started_ms) != 0) {
                  int prev = (id(actual_stage_last_kind) - 1) * 5 + id(actual_stage_last_zone) - 1;
                  id(actual_stage_seconds)[prev] += (millis() - id(actual_stage_started_ms)) / 1000u;
                }
                id(actual_stage_last_kind) = 2;
                id(actual_stage_last_zone) = 5;
                id(actual_stage_started_ms) = millis();
                id(stage_kind) = 2;
                id(stage_zone) = 5;
                id(stage_deadline_ms) = millis() + (uint32_t)(id(detergent_time_z5).state * 1000.0f);
                id(stage_frozen_seconds) = 0;

            - delay: !lambda |-
                return (uint32_t)
                  (id(detergent_time_z5).state * 1000.0f);
            - lambda: |-
                // Freeze actual elapsed time at the end of this timed step.
                // Do not include valve overlap or source-switching delays.
                if (id(actual_stage_last_kind) == 2 &&
                    id(actual_stage_last_zone) == 5 &&
                    id(actual_stage_started_ms) != 0) {
                  const int i = 9;
                  id(actual_stage_seconds)[i] += (millis() - id(actual_stage_started_ms)) / 1000u;
                  id(actual_stage_last_kind) = 0;
                  id(actual_stage_last_zone) = 0;
                  id(actual_stage_started_ms) = 0;
                }


            - switch.turn_off: valve_detergent

            - lambda: |-
                id(flow_check_allowed) = false;

                id(wash_state).publish_state(
                  "Source Delay - Zone 5"
                );

            - delay: !lambda |-
                return (uint32_t)
                  (id(source_delay).state * 1000.0f);

            - switch.turn_on: valve_water
            - script.execute: flow_enable_delay

            - lambda: |-
                id(wash_state).publish_state(
                  "Rinse - Zone 5"
                );

            - lambda: |-
                // Finish previous stage at the exact transition, then start this timer.
                if (id(actual_stage_last_kind) >= 1 && id(actual_stage_last_kind) <= 3 &&
                    id(actual_stage_last_zone) >= 1 && id(actual_stage_last_zone) <= 5 &&
                    id(actual_stage_started_ms) != 0) {
                  int prev = (id(actual_stage_last_kind) - 1) * 5 + id(actual_stage_last_zone) - 1;
                  id(actual_stage_seconds)[prev] += (millis() - id(actual_stage_started_ms)) / 1000u;
                }
                id(actual_stage_last_kind) = 3;
                id(actual_stage_last_zone) = 5;
                id(actual_stage_started_ms) = millis();
                id(stage_kind) = 3;
                id(stage_zone) = 5;
                id(stage_deadline_ms) = millis() + (uint32_t)(id(rinse_time_z5).state * 1000.0f);
                id(stage_frozen_seconds) = 0;

            - delay: !lambda |-
                return (uint32_t)
                  (id(rinse_time_z5).state * 1000.0f);
            - lambda: |-
                // Freeze actual elapsed time at the end of this timed step.
                // Do not include valve overlap or source-switching delays.
                if (id(actual_stage_last_kind) == 3 &&
                    id(actual_stage_last_zone) == 5 &&
                    id(actual_stage_started_ms) != 0) {
                  const int i = 14;
                  id(actual_stage_seconds)[i] += (millis() - id(actual_stage_started_ms)) / 1000u;
                  id(actual_stage_last_kind) = 0;
                  id(actual_stage_last_zone) = 0;
                  id(actual_stage_started_ms) = 0;
                }



      - script.execute: finish_wash


  # ==========================================================
  # FINISH WASH
  # ==========================================================

  - id: finish_wash
    mode: single
    then:
      - lambda: |-
          id(flow_check_allowed) = false;
          id(finishing_check) = true;
          id(finish_fault_pending) = false;
          id(final_flow_last_good_ms) = 0;
          id(violation_kind) = 0;
          id(violation_elapsed_s) = 0;
          if (id(actual_stage_last_kind) >= 1 && id(actual_stage_last_kind) <= 3 &&
              id(actual_stage_last_zone) >= 1 && id(actual_stage_last_zone) <= 5 &&
              id(actual_stage_started_ms) != 0) {
            int i = (id(actual_stage_last_kind) - 1) * 5 + id(actual_stage_last_zone) - 1;
            id(actual_stage_seconds)[i] += (millis() - id(actual_stage_started_ms)) / 1000u;
          }
          id(actual_stage_last_kind) = 0;
          id(actual_stage_last_zone) = 0;
          id(actual_stage_started_ms) = 0;
          id(stage_kind) = 4;
          id(stage_zone) = id(current_zone_num);
          id(stage_deadline_ms) = millis() + 15000u +
              (uint32_t)(id(flow_start_delay).state * 1000.0f);
          id(wash_state).publish_state("Pressure Release");
      - script.stop: flow_enable_delay
      - switch.turn_off: valve_water
      - switch.turn_off: valve_detergent
      - delay: 15s
      - lambda: |-
          id(wash_state).publish_state("Main Valve Check");
          id(final_flow_last_good_ms) = millis();
          id(violation_kind) = 0;
          id(violation_elapsed_s) = 0;
      - delay: !lambda |-
          return (uint32_t)(id(flow_start_delay).state * 1000.0f);
      - lambda: |-
          // Confirm at the exact end of the full check window. The watchdog
          // updates last-good time on every normal sample.
          const float f = id(water_flow).state;
          const uint32_t window_ms = (uint32_t)(id(flow_start_delay).state * 1000.0f);
          id(finish_fault_pending) = id(flow_protection).state &&
              !isnan(f) && f > id(leak_flow).state &&
              (uint32_t)(millis() - id(final_flow_last_good_ms)) >= window_ms;
      # Zone is always closed, even when a valve failure is detected.
      - switch.turn_off: zone1_relay
      - switch.turn_off: zone2_relay
      - switch.turn_off: zone3_relay
      - switch.turn_off: zone4_relay
      - switch.turn_off: zone5_relay
      - delay: 500ms
      - switch.turn_off: valve_power
      - lambda: |-
          id(finishing_check) = false;
          id(stage_deadline_ms) = 0;
          id(stage_frozen_seconds) = 0;
          if (id(finish_fault_pending)) {
            id(fault_kind) = 4;
            id(fault_zone) = id(current_zone_num);
            id(fault_flow) = id(water_flow).state;
            id(fault_threshold) = id(leak_flow).state;
            id(emergency_active) = true;
            id(wash_state).publish_state("Main Valve Not Closed");
          } else {
            id(stage_kind) = 0;
            id(stage_zone) = 0;
            id(wash_state).publish_state("Ready");
          }
          id(wash_running) = false;
          id(current_zone_num) = 0;
          id(violation_kind) = 0;
          id(violation_elapsed_s) = 0;

# ============================================================
# LOCAL SAFETY WATCHDOG
# ============================================================

interval:

  # Integrate raw hardware pulses into a persisted total independently
  # of whether a washing program is running or valves are opened manually.
  - interval: 1s
    then:
      - lambda: |-
          const float raw = id(water_total_raw).state;
          if (isnan(raw)) return;
          if (!id(raw_meter_initialized)) {
            id(last_raw_pulses_liters) = raw;
            id(raw_meter_initialized) = true;
            return;
          }
          const float delta = raw - id(last_raw_pulses_liters);
          id(last_raw_pulses_liters) = raw;
          if (delta > 0.0f && delta < 10000.0f)
            id(persistent_water_liters) += delta;

  # Account for actual meter volume deltas, not flow estimates. If two
  # zone relays overlap, divide that volume equally between open zones.
  - interval: 1s
    then:
      - lambda: |-
          const float meter = id(water_total).state;
          if (isnan(meter)) return;
          if (!id(meter_initialized)) {
            id(last_meter_liters) = meter;
            id(meter_initialized) = true;
            return;
          }
          const float delta = meter - id(last_meter_liters);
          id(last_meter_liters) = meter;
          if (delta <= 0.0f || !id(wash_running)) return;
          id(wash_liters) += delta;
          const bool open[5] = {
            id(zone1_relay).state, id(zone2_relay).state,
            id(zone3_relay).state, id(zone4_relay).state,
            id(zone5_relay).state
          };
          int count = 0;
          for (int i = 0; i < 5; ++i) if (open[i]) ++count;
          if (count > 0) {
            for (int i = 0; i < 5; ++i)
              if (open[i]) id(wash_zone_liters)[i] += delta / count;
          }

  # Confirm continuous faults locally. During final test, do not stop
  # finish_wash: it must close the last zone regardless of flow.
  - interval: 1s
    then:
      - lambda: |-
          const bool source_open = id(valve_water).state || id(valve_detergent).state;
          const float f = id(water_flow).state;
          int kind = 0;
          float threshold = 0.0f;
          if (id(flow_protection).state && !id(emergency_active) && !isnan(f)) {
            if (id(finishing_check)) {
              if (id(wash_state).state == "Main Valve Check" &&
                  f <= id(leak_flow).state)
                id(final_flow_last_good_ms) = millis();
              if (id(wash_state).state == "Main Valve Check" &&
                  f > id(leak_flow).state) {
                kind = 4;
                threshold = id(leak_flow).state;
              }
            } else if (id(wash_running) && source_open && id(flow_check_allowed)) {
              if (f < id(min_flow).state) {
                kind = 1;
                threshold = id(min_flow).state;
              } else if (f > id(max_flow).state) {
                kind = 2;
                threshold = id(max_flow).state;
              }
            } else if (!id(wash_running) && !source_open && f > id(leak_flow).state) {
              kind = 3;
              threshold = id(leak_flow).state;
            }
          }
          if (kind == 0) {
            id(violation_kind) = 0;
            id(violation_elapsed_s) = 0;
            id(violation_start_ms) = 0;
            return;
          }
          if (kind != id(violation_kind)) {
            id(violation_kind) = kind;
            id(violation_start_ms) = millis();
            id(violation_elapsed_s) = 0;
          } else {
            id(violation_elapsed_s) = (int)((uint32_t)(millis() - id(violation_start_ms)) / 1000u);
          }
          if (id(violation_elapsed_s) < (int)id(flow_start_delay).state)
            return;
          if (kind == 4) {
            return; // finish_wash decides at the end of the full window
          }
          id(fault_kind) = kind;
          id(fault_zone) = id(current_zone_num);
          id(fault_flow) = f;
          id(fault_threshold) = threshold;
          id(violation_elapsed_s) = (int)id(flow_start_delay).state;
          if (kind == 1) id(wash_state).publish_state("Low Flow");
          else if (kind == 2) id(wash_state).publish_state("High Flow");
          else id(wash_state).publish_state("Leak Detected");
      - if:
          condition:
            lambda: |-
              return id(fault_kind) != 0 && !id(emergency_active) &&
                     !id(finishing_check);
          then:
            - script.execute: emergency_stop
