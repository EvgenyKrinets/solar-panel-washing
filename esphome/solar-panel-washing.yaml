    update_interval: 30s

    lambda: |-
      if (!id(auto_start_enabled).state)
        return {"Disabled"};

      auto now = id(system_time).now();

      if (!now.is_valid())
        return {"Waiting for time"};

      char buffer[32];

      snprintf(
        buffer,
        sizeof(buffer),
        "%02d:%02d",
        (int) id(auto_start_hour).state,
        (int) id(auto_start_minute).state
      );

      return {buffer};


